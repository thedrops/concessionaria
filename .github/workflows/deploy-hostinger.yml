name: Deploy Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -H "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload files
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude "backups" \
            -e "ssh -i ~/.ssh/hostinger" \
            ./ "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_APP_DIR }}/"

      - name: Write production env
        run: |
          cat > .env.production.deploy <<'EOF'
          ${{ secrets.PRODUCTION_ENV_FILE }}
          EOF
          scp -i ~/.ssh/hostinger .env.production.deploy "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_APP_DIR }}/.env.production"
          rm -f .env.production.deploy

      - name: Deploy
        run: |
          ssh -i ~/.ssh/hostinger "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "cd '${{ secrets.HOSTINGER_APP_DIR }}' && chmod +x infra/hostinger/*.sh && APP_DIR='${{ secrets.HOSTINGER_APP_DIR }}' ./infra/hostinger/deploy.sh"
